# Mapa do pátio — layout v4 da ilha compacta.
#
# O Guilherme edita aqui caminhos, zonas e props fixos.
# Autotile, decoração espalhada (girassol, cogumelo, borboleta), colisão e navegação ficam no código.
# Morango (bloom) não entra no chão.
# O desenho de cada peça está em docs/design/tiny-farm/target-v4.md.
#
# Prateleira sul: a elipse fechava num bico. A península (32, 50) abre a orla
# de grama para os lados. A água ao sul das colunas 30 e 32 continua na fileira
# 52, então a pesca em (30, 51) e (32, 51) segue virada para o sul.
# Lírios e juncos dessa orla desceram para a fileira 52 (água rasa, fora do píer).
# Canteiros, lenha, toco e píer não mudaram de célula.
# A cerca de cima começa na coluna 16 para não cruzar a estufa.
# A fruteira do sudoeste foi para (16, 45) para não cruzar essa cerca.
# Picnic.png é só toalha xadrez, então não há mesa de piquenique no pátio.
# Coconut Tree.png é uma rede entre duas palmeiras, então não entra como palmeira.
#
# `row` de um prop: número da célula, ou um token resolvido depois da costa:
#   gate, gate-3, gate+1   — cerca sul
#   south, south-1         — última célula de terra daquela coluna
#   lodge                  — fileira da porta do lodge
#
# Depois de salvar, gere a prova local (PNG fora do git):
#   npx vite-node scripts/render-courtyard.ts
#   docs/design/tiny-farm/courtyard-1x.png
