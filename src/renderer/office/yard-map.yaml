# Mapa do pátio — layout v4 da ilha compacta.
#
# O Guilherme edita aqui caminhos, zonas e props fixos.
# Autotile, decoração espalhada (girassol, cogumelo, borboleta), colisão e navegação ficam no código.
# Morango (bloom) não entra no chão.
# O desenho de cada peça está em docs/design/tiny-farm/target-v4.md.
#
# `row` de um prop: número da célula, ou um token resolvido depois da costa:
#   gate, gate-3, gate+1   — cerca sul
#   south, south-1         — última célula de terra daquela coluna
#   lodge                  — fileira da porta do lodge
#
# Depois de salvar, gere a prova local (PNG fora do git):
#   npx vite-node scripts/render-courtyard.ts
#   docs/design/tiny-farm/courtyard-1x.png
